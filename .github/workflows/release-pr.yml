# Tests a Steampipe plugin SDK release PR and builds a consumer against it, then writes the record on the PR. It starts from the PR's
# own events (the fleet App opens the PR, so they start workflows), or by name to run the record again (workflow_dispatch, input `pr`).
name: Release PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: The release PR's number
        required: true

permissions: {}

jobs:
  results:
    if: >-
      ${{ github.event_name != 'pull_request_review'
      && (github.event_name == 'workflow_dispatch'
      || (startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    uses: turbot/shipyard-workflows/.github/workflows/go-library-candidate.yml@v0
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The consumer built against the candidate: the SDK's tests and this build must both pass for a SHIP.
      consumer: turbot/steampipe-plugin-aws
  record:
    needs: results
    if: >-
      ${{ !cancelled()
      && (github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.base.ref == 'main'
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.event.pull_request.head.repo.full_name == github.repository))
      && (github.event_name == 'pull_request_review' || needs.results.result == 'success') }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      statuses: write
      actions: write
      id-token: write
    uses: turbot/shipyard-workflows/.github/workflows/record.yml@v0
    with:
      pr: ${{ github.event.pull_request.number || inputs.pr }}
      results-run: ${{ github.run_id }}
      review: ${{ github.event_name == 'pull_request_review' }}
      ignore-checks: record / record
      # The workflow behind develop's required `ci` check (acceptance-test.yml, whose `ci` job needs both of its test jobs) can run
      # by hand. The changelog line status (shipyard-pr.yml) is posted only on PRs into develop.
      required-check-workflows: acceptance-test.yml
      # The acceptance workflow builds Steampipe and the chaos plugin, close to the 10-minute default.
      check-wait-minutes: '25'
