# What a change to the plugin SDK must run and show before an agent's PR counts as done.
#
# Left out on purpose:
# - golangci-lint: CI pins v2.10.1, and v2.15.0 (which loads Go 1.27) reports four findings on
#   develop (govet inline, nolintlint, staticcheck SA1019).
# - The acceptance job: it builds steampipe against this checkout and installs the chaos plugin
#   into the machine's own steampipe install (see never_run). CI runs it.

ci_is_proof: false

never_run:
  # Releases
  - gh workflow run
  - gh release
  - git tag
  # Installs into the machine's own steampipe install (~/.steampipe)
  - steampipe plugin install*

checks:
  build: {run: "go build ./...", cost: 1}
  # -race, as CI runs it: the SDK's race regression tests only fail under the race detector.
  unit: {run: "go test -race -count=1 -timeout 900s ./...", cost: 1}

kinds:
  code:
    paths: ["**/*.go", "go.mod", "go.sum", "grpc/**", "plugin/**", "Makefile", ".golangci.yml"]
    checks: [build, unit]
    show: [test]
  workflows:
    paths: [".github/**", ".gitignore"]
    show: [none]
  docs:
    paths: ["**/*.md", "docs/**", "design/**", ".claude/**", "LICENSE"]
    show: [none]
